<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Siguatepeque biomedical systems</title>
  <desc id="desc">A dark iridescent banner with flowing data ribbons and a cranial implant mesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.5" stop-color="#091326"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(980 112) rotate(145) scale(430 250)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#19d3e6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="150" y1="280" x2="1035" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6f61"/>
      <stop offset="0.28" stop-color="#ffb547"/>
      <stop offset="0.56" stop-color="#2dd4da"/>
      <stop offset="0.82" stop-color="#8c6cff"/>
      <stop offset="1" stop-color="#ef74d1"/>
    </linearGradient>
    <linearGradient id="spectrumFade" x1="645" y1="250" x2="1110" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4da" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#8c6cff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ff7d8c" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa0c8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cranialClip">
      <path d="M1004 48C947 29 874 48 846 101c-19 36-16 83 7 112 15 19 37 27 49 43 9 11 9 26 11 39h85c-2-20-2-35 11-50 14-16 32-24 43-47 14-29 15-65 1-95-10-23-27-43-49-55Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#9fb2d1" stroke-opacity="0.17"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="url(#microgrid)"/>
  <rect width="1200" height="340" rx="24" fill="url(#aura)"/>

