<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hl-title hl-desc">
  <title id="hl-title">Siguatepeque — Biomedical Field Terminal</title>
  <desc id="hl-desc">Light instrument panel reading SIGUATEPEQUE, BIOMEDICAL FIELD TERMINAL, and the tagline CODE IS LAB EQUIPMENT on an amber warning chip, beside a teal oscilloscope trace and three status lights.</desc>
  <defs>
    <filter id="glow-l" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="228" rx="10" fill="#ece3cf" stroke="#b8a97e" stroke-width="2"/>
  <rect x="15" y="15" width="870" height="200" rx="6" fill="#e2d6ba" stroke="#cbb98a" stroke-width="1"/>
  <circle cx="27" cy="27" r="2.5" fill="#a89468"/>
  <circle cx="873" cy="27" r="2.5" fill="#a89468"/>
  <circle cx="27" cy="203" r="2.5" fill="#a89468"/>
  <circle cx="873" cy="203" r="2.5" fill="#a89468"/>

  <text x="40" y="75" font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace" font-size="40" font-weight="700" letter-spacing="3" fill="#241a10">SIGUATEPEQUE</text>
  <text x="40" y="98" font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace" font-size="14" letter-spacing="4" fill="#0f6b76">BIOMEDICAL FIELD TERMINAL</text>

