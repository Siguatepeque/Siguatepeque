<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hd-title hd-desc">
  <title id="hd-title">Siguatepeque — Biomedical Field Terminal</title>
  <desc id="hd-desc">Dark instrument panel reading SIGUATEPEQUE, BIOMEDICAL FIELD TERMINAL, and the tagline CODE IS LAB EQUIPMENT, beside a cyan oscilloscope trace and three status lights.</desc>
  <defs>
    <filter id="glow-d" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="228" rx="10" fill="#14100c" stroke="#3a332a" stroke-width="2"/>
  <rect x="15" y="15" width="870" height="200" rx="6" fill="#181310" stroke="#2b241c" stroke-width="1"/>
