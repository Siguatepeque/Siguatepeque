name: Update profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator
        run: pip install github-readme-terminal==0.0.3

      - name: Generate top languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_top_langs.py

      - name: Generate terminal GIF
        run: python .github/scripts/gen_profile_gif.py

      - name: Commit changed assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg output.gif
          if git diff --cached --quiet; then
            echo "profile assets are unchanged."
            exit 0
          fi
          git commit -m "Update profile assets"
          git push origin "HEAD:${DEFAULT_BRANCH}"